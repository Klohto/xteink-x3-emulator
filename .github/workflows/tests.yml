name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent WPA2 validation provider
        run: python -m pip install cryptography==46.0.0
      - name: Check image, storage, runtime and clock behaviour
        run: python -m unittest discover -s tests -v
  image_experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the palette and BMP output
        run: |
          python -m pip install -e '.[image-experiment]'
          python -m unittest discover -s tests -p test_image_experiment.py -v
      - name: Generate the image study and SD card
        run: python -m x3emu.image_experiment --output "$RUNNER_TEMP/x3-image-study"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x3-image-study-${{ github.sha }}
          path: ${{ runner.temp }}/x3-image-study
          retention-days: 30
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install backend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libglib2.0-dev libpixman-1-dev libgcrypt20-dev ninja-build libslirp-dev libpcre2-dev zlib1g-dev
          python -m pip install meson==1.8.5 pycotap==1.3.1 esptool==5.1.0
      - name: Build the pinned backend and exercise device protocols
        id: native_backend
        run: scripts/build-qemu.sh --fetch --test --jobs 4
      - name: Preserve the exact native backend and protocol receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && (steps.native_backend.outcome == 'success' || steps.native_backend.outcome == 'failure')
        with:
          name: x3-native-backend-${{ github.sha }}
          path: |
            local/qemu/build/qemu-system-riscv32
            local/qemu/src/pc-bios/esp32c3-rom.bin
            local/qemu/install/backend.json
            local/qemu/build/native-tests
            local/qemu/build/subprojects.json
          compression-level: 6
          retention-days: 30
          if-no-files-found: warn
      - name: Prepare pinned CrossInk inputs and source notices
        if: github.ref == 'refs/heads/main'
        run: |
          python -m x3emu.firmware --download --directory local/firmware
          git clone --filter=blob:none --no-checkout https://github.com/uxjulia/CrossInk.git local/package-sources/CrossInk
          git -C local/package-sources/CrossInk checkout --detach 31ce770487bfa9cb70447a374cdd8aae89d8bfe4
          git clone --filter=blob:none --no-checkout https://github.com/uxjulia/CrossInk.git local/package-sources/CrossInk-v161
          git -C local/package-sources/CrossInk-v161 checkout --detach 9914146eeae7b46b300f475a16c32426fc02ec1f
          git clone --filter=blob:none --no-checkout https://github.com/Free-Ink/freeink-sdk.git local/package-sources/freeink-sdk
          git -C local/package-sources/freeink-sdk checkout --detach b784446302c076b4b5a622627867f0c80905cc50
          git clone --filter=blob:none --no-checkout https://github.com/Free-Ink/freeink-sdk.git local/package-sources/freeink-sdk-v161
          git -C local/package-sources/freeink-sdk-v161 checkout --detach 699370183fa3a0e33c9cb83a36f701bbb6022095
      - name: Package the working Linux front panel and native backend
        id: runtime_package
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/package-runtime.py \
            --output "$RUNNER_TEMP/xteink-x3-crossink-linux-x86_64" \
            --archive "$RUNNER_TEMP/xteink-x3-crossink-linux-x86_64.tar.gz" \
            --backend local/qemu/install/bin/qemu-system-riscv32 \
            --rom-dir local/qemu/install/share/qemu \
            --firmware-dir local/firmware --qemu-source local/qemu/src \
            --crossink-source local/package-sources/CrossInk \
            --sdk-source local/package-sources/freeink-sdk \
            --slirp-notice /usr/share/doc/libslirp0/copyright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main'
        with:
          name: xteink-x3-crossink-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/xteink-x3-crossink-linux-x86_64.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Split the sealed runtime for bounded artifact retrieval
        if: github.ref == 'refs/heads/main'
        run: |
          split --bytes=24M --numeric-suffixes=1 --suffix-length=1 \
            "$RUNNER_TEMP/xteink-x3-crossink-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP/x3-runtime-part-"
          sha256sum "$RUNNER_TEMP/xteink-x3-crossink-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP"/x3-runtime-part-* > "$RUNNER_TEMP/x3-runtime-parts.sha256"
      - name: Preserve runtime part 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main'
        with:
          name: x3-runtime-part-1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/x3-runtime-part-1
            ${{ runner.temp }}/x3-runtime-parts.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve runtime part 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main'
        with:
          name: x3-runtime-part-2-${{ github.sha }}
          path: ${{ runner.temp }}/x3-runtime-part-2
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve runtime part 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main'
        with:
          name: x3-runtime-part-3-${{ github.sha }}
          path: ${{ runner.temp }}/x3-runtime-part-3
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Install real guest online-update observation dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get install -y tesseract-ocr
          python -m pip install Pillow==12.3.0
      - name: CrossInk direct online OTA, reboot and book reading
        id: online_ota
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 30
        run: |
          python scripts/test-crossink-online-ota.py \
            --output "$RUNNER_TEMP/x3-online-ota" \
            --backend local/qemu/install/bin/qemu-system-riscv32 \
            --rom-dir local/qemu/install/share/qemu \
            --flash local/firmware/crossink-v1.6.0-x3-full-flash.bin \
            --source local/package-sources/CrossInk --download
      - name: Preserve actual online OTA result and written guest storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && (steps.online_ota.outcome == 'success' || steps.online_ota.outcome == 'failure')
        with:
          name: x3-crossink-online-ota-${{ github.sha }}
          path: ${{ runner.temp }}/x3-online-ota
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Preserve compact OTA receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        with:
          name: x3-ota-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/x3-online-ota/*.json
            ${{ runner.temp }}/x3-online-ota/virgin-book-card.img
            ${{ runner.temp }}/x3-online-ota/host-only-official-update
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Preserve OTA CPU storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        with:
          name: x3-ota-update-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/x3-online-ota/online-upgrade
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Preserve OTA reader storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        with:
          name: x3-ota-reader-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/x3-online-ota/cold-written-v161
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Preserve OTA cold reader storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        with:
          name: x3-ota-cold-reader-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/x3-online-ota/cold-saved-reader
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Original footnote persistence and cold link restoration on OTA-written CrossInk
        id: footnotes
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        timeout-minutes: 20
        run: |
          python scripts/test-crossink-v161-footnotes.py \
            --ota-output "$RUNNER_TEMP/x3-online-ota" \
            --output "$RUNNER_TEMP/x3-v161-footnotes" \
            --source local/package-sources/CrossInk-v161 \
            --backend local/qemu/install/bin/qemu-system-riscv32 \
            --rom-dir local/qemu/install/share/qemu
      - name: Preserve actual footnote result and written guest storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && (steps.footnotes.outcome == 'success' || steps.footnotes.outcome == 'failure')
        with:
          name: x3-crossink-v161-footnotes-${{ github.sha }}
          path: ${{ runner.temp }}/x3-v161-footnotes
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Unchanged guest gauge capacity load and stock software reset
        id: battery_capacity
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        timeout-minutes: 20
        run: |
          python scripts/test-crossink-battery-capacity.py \
            --ota-output "$RUNNER_TEMP/x3-online-ota" \
            --output "$RUNNER_TEMP/x3-v161-battery-capacity" \
            --source local/package-sources/CrossInk-v161 \
            --sdk-source local/package-sources/freeink-sdk-v161 \
            --backend local/qemu/install/bin/qemu-system-riscv32 \
            --rom-dir local/qemu/install/share/qemu
      - name: Preserve actual guest gauge result and written storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && (steps.battery_capacity.outcome == 'success' || steps.battery_capacity.outcome == 'failure')
        with:
          name: x3-crossink-v161-battery-capacity-${{ github.sha }}
          path: ${{ runner.temp }}/x3-v161-battery-capacity
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Actual HTTP panel reading and fresh CPU restoration on OTA-written CrossInk
        id: panel_v161
        if: always() && github.ref == 'refs/heads/main' && steps.online_ota.outcome == 'success'
        timeout-minutes: 20
        run: |
          python scripts/test-crossink-v161-panel.py \
            --ota-output "$RUNNER_TEMP/x3-online-ota" \
            --output "$RUNNER_TEMP/x3-v161-panel" \
            --source local/package-sources/CrossInk-v161 \
            --backend local/qemu/install/bin/qemu-system-riscv32 \
            --rom-dir local/qemu/install/share/qemu
      - name: Preserve actual HTTP panel result and written guest storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.ref == 'refs/heads/main' && (steps.panel_v161.outcome == 'success' || steps.panel_v161.outcome == 'failure')
        with:
          name: x3-crossink-v161-panel-${{ github.sha }}
          path: ${{ runner.temp }}/x3-v161-panel
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
