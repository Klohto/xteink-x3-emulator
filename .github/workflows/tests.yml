name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check image, storage, runtime and clock behaviour
        run: python -m unittest discover -s tests -v
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install backend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libglib2.0-dev libpixman-1-dev libgcrypt20-dev ninja-build libslirp-dev libpcre2-dev zlib1g-dev
          python -m pip install meson==1.8.5 pycotap==1.3.1
      - name: Build the pinned backend and exercise device protocols
        run: scripts/build-qemu.sh --fetch --test --jobs 4
