[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xteink-x3-emulator"
version = "0.1.0"
description = "Foundations for Xteink X3 emulation and CrossInk performance search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Klohto/xteink-x3-emulator"

[tool.setuptools.packages.find]
where = ["."]
include = ["x3emu*"]
