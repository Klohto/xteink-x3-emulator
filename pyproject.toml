[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xteink-x3-emulator"
version = "0.2.0"
description = "ESP32-C3 firmware execution with an Xteink X3 board model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validation = ["cryptography==46.0.0"]

[project.urls]
Repository = "https://github.com/Klohto/xteink-x3-emulator"

[tool.setuptools.packages.find]
where = ["."]
include = ["x3emu*"]

[tool.setuptools.package-data]
x3emu = ["assets/*.html"]
